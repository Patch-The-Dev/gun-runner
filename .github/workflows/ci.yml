name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          version: 1.2.0
          cache: true

      - name: Install Wally packages
        run: wally install

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Build game and test places
        run: |
          mkdir -p build
          rojo build default.project.json --output build/GunRunner.rbxlx
          rojo build test.project.json --output build/GunRunnerTests.rbxlx
